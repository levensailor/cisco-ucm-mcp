[project]
name = "cisco-ucm-mcp"
version = "0.1.0"
description = "MCP server for Cisco Unified Communications Manager (AXL, RIS, Serviceability, Phone XSI)"
readme = "README.md"
authors = [
    { name = "Jeff Levensailor", email = "jeff@levensailor.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "pydantic-settings>=2.7.0",
    "zeep>=4.3.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "urllib3>=2.0.0",
    "ciscoaxl @ git+https://github.com/levensailor/ciscoaxl.git",
]

[project.scripts]
ucm-mcp = "ucm_mcp.server:main"
cisco-ucm-mcp = "ucm_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.build-backend]
module-name = "ucm_mcp"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
